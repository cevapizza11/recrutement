<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recrutement — Moule &amp; Smile</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="contrats.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--noir:#0d0d0d;--carte:#171717;--carte2:#1f1f1f;--ligne:#2c2c2c;--or:#d4a537;--or2:#f0c75e;--txt:#f3f0e8;--gris:#9a958a;--rouge:#e5534b;--vert:#3fb27f;--bleu:#5aa1e3;--orange:#e8963a}
*{box-sizing:border-box}
body{margin:0;background:var(--noir);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--or);padding:8px 12px;display:flex;align-items:center;gap:8px}
header img{width:30px;height:30px}
header h1{font-size:16px;margin:0;color:var(--or)}
header .v{font-size:11px;color:var(--gris)}
header .actions{margin-left:auto;display:flex;gap:6px}
.ib{background:#1a1a1a;border:1px solid #333;color:var(--txt);border-radius:9px;padding:7px 10px;font-size:15px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--or);color:var(--or);background:transparent;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.plein{background:var(--or);color:#111}
.btn.rouge{border-color:var(--rouge);color:var(--rouge)}
.btn.petit{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:var(--txt);border-radius:9px;padding:9px 10px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--or)}
label.l{display:block;font-size:12.5px;color:var(--gris);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.g3{grid-template-columns:1fr 1fr}}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:13px;padding:12px;margin-bottom:10px}
.cache{display:none!important}
.badge{display:inline-block;font-size:11.5px;border-radius:20px;padding:2px 8px;margin:2px 3px 0 0;background:#262626;color:var(--gris);white-space:nowrap}
.badge.or{background:#2b2210;color:var(--or2)}
.badge.rouge{background:#3a1414;color:#ff9b94}
.badge.vert{background:#0f2e20;color:#7fdcb0}
.badge.bleu{background:#11263a;color:#9ccaf3}
.badge.orange{background:#3a250e;color:#f5b672}
/* tableau de bord */
.compteurs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.compteurs button{flex:none;background:var(--carte);border:1px solid var(--ligne);color:var(--txt);border-radius:11px;padding:8px 10px;min-width:92px;text-align:left;cursor:pointer}
.compteurs button b{display:block;font-size:20px;color:var(--or)}
.compteurs button span{font-size:11.5px;color:var(--gris)}
.compteurs button.on{border-color:var(--or);background:#211a09}
.cand{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:#2b2210;color:var(--or);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cand .info{flex:1;min-width:0}
.cand .nom{font-weight:700}
.cand .sous{font-size:12.5px;color:var(--gris)}
.cand .etp{font-size:12px;color:var(--or);text-align:right;flex:none}
/* fiche */
.tete{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tete h2{margin:0;font-size:20px}
.contacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stepper{display:flex;gap:4px;overflow-x:auto;margin:12px 0 6px;padding-bottom:4px}
.stepper div{flex:1;min-width:80px;text-align:center;font-size:11px;color:var(--gris);padding-top:6px;border-top:4px solid #2c2c2c;cursor:pointer}
.stepper div.fait{border-color:#8a6c20;color:var(--or2)}
.stepper div.cour{border-color:var(--or);color:var(--or);font-weight:700}
details.etape{background:var(--carte);border:1px solid var(--ligne);border-radius:13px;margin-bottom:10px}
details.etape>summary{list-style:none;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
details.etape>summary::-webkit-details-marker{display:none}
details.etape>summary .n{width:26px;height:26px;border-radius:50%;background:#262626;color:var(--gris);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
details.etape.fait>summary .n{background:#8a6c20;color:#111}
details.etape.cour{border-color:var(--or)}
details.etape.cour>summary .n{background:var(--or);color:#111}
details.etape .corps{padding:0 12px 12px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #242424}
.check:last-child{border-bottom:none}
.check .t{flex:1}
.check small{color:var(--gris);display:block}
.doc{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #242424;font-size:14px}
.doc a{color:var(--or2);text-decoration:none;flex:1}
.doc.manque{color:#ff9b94}
.alerte{background:#2b1e05;border:1px solid #7a5a12;color:#f5d58a;border-radius:10px;padding:9px 11px;font-size:13.5px;margin:8px 0}
.alerte.rouge{background:#2e0f0f;border-color:#7a2020;color:#ffb3ae}
.alerte.info{background:#0f2133;border-color:#22507a;color:#b7d8f7}
.note{display:flex;align-items:center;gap:8px;margin:5px 0}
.note span{flex:1;font-size:14px}
.note .et{display:flex;gap:3px}
.note .et button{width:30px;height:30px;border-radius:7px;border:1px solid #333;background:#111;color:var(--gris);cursor:pointer}
.note .et button.on{background:var(--or);color:#111;border-color:var(--or)}
.journal div{font-size:12.5px;color:var(--gris);padding:3px 0;border-bottom:1px dashed #262626}
.barre-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* modale */
.modale{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.modale .boite{background:var(--carte);border:1px solid var(--or);border-radius:14px;width:100%;max-width:860px;max-height:94vh;display:flex;flex-direction:column}
.modale .bt{padding:10px 12px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:8px}
.modale .bt b{flex:1;color:var(--or)}
.modale .bc{padding:12px;overflow:auto;flex:1}
.modale iframe{width:100%;height:62vh;border:none;background:#fff;border-radius:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--or);color:var(--txt);padding:9px 16px;border-radius:20px;z-index:60;font-size:14px}
.login{max-width:420px;margin:60px auto}
table.pc{width:100%;border-collapse:collapse;font-size:13.5px}
table.pc td{padding:5px 4px;border-bottom:1px solid #242424}
.regles li{margin:4px 0}
.vide{text-align:center;color:var(--gris);padding:30px}
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt="">
  <div><h1>Recrutement</h1><div class="v">Moule &amp; Smile · v.25/11/2026 10:58</div></div>
  <div class="actions" id="hdrActions">
    <button class="ib" title="Tableau" onclick="vue('liste')">📋</button>
    <button class="ib" title="Ajouter une fiche" onclick="creerFiche()">＋</button>
    <button class="ib" title="Lien candidat" onclick="modaleLien()">🔗</button>
    <button class="ib" title="Réglages" onclick="vue('reglages')">⚙️</button>
    <button class="ib" title="Actualiser" onclick="charger()">↻</button>
  </div>
</header>
<main id="app"></main>
<div id="modale"></div>

<script>
// =====================================================================
//  ÉTAT
// =====================================================================
const ETAPES=[
  {k:'recu',n:'Candidature reçue',c:'Reçue'},
  {k:'contact',n:'Prise de contact',c:'Contact'},
  {k:'entretien',n:'Entretien',c:'Entretien'},
  {k:'validation',n:'Validation',c:'Validation'},
  {k:'contrat',n:'Contrat',c:'Contrat'},
  {k:'tenue',n:'Tenue donnée',c:'Tenue'},
  {k:'demarrage',n:'Démarrage',c:'Démarrage'},
  {k:'enposte',n:'En poste',c:'En poste'}
];
const IDX=Object.fromEntries(ETAPES.map((e,i)=>[e.k,i]));
const GRILLE=[['presentation','Présentation / ponctualité'],['motivation','Motivation'],['experience','Expérience'],['dispo','Disponibilités'],['equipe','Esprit d\'équipe'],['rush','Résistance au rush']];
const CHECK_DEMARRAGE=[['accueil','Accueil et visite du restaurant'],['livret','Livret d\'accueil / règles de la maison remis'],['hygiene','Formation hygiène / HACCP de base'],['securite','Consignes de sécurité et plans d\'évacuation'],['pointeuse','Compte créé dans la Pointeuse (bouton ci-dessus)'],['planning','Ajouté(e) dans Planning & RH (même bouton)'],['caisse','Accès caisse / appli commande si besoin']];
const ARTICLES_TENUE=['T-shirt Moule & Smile','Casquette','Tablier'];
let S={cle:localStorage.getItem('rec_cle')||'',candidats:[],config:null,sheetUrl:'',driveUrl:'',vue:'liste',filtre:'actifs',recherche:'',id:null,demo:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const frH=d=>d?fr(d)+(String(d).length>10?' '+String(d).slice(11,16):''):'';
const auj=()=>new Date().toISOString().slice(0,10);
const apiOK=()=>typeof API_URL==='string'&&API_URL.startsWith('https://');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300);}
const cur=()=>S.candidats.find(c=>c.id===S.id);

// =====================================================================
//  API
// =====================================================================
async function api(action,data={}){
  if(S.demo) return demoApi(action,data);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,cle:S.cle,...data})});
  const j=await r.json();
  if(!j.ok) throw new Error(j.erreur||'Erreur');
  return j;
}
async function charger(){
  if(!apiOK()){ S.demo=true; demoInit(); return rendu(); }
  if(!S.cle) return ecranLogin();
  $('app').innerHTML='<div class="vide">Chargement…</div>';
  try{
    const j=await api('liste');
    S.candidats=j.candidats; S.config=j.config;
    const idUrl=new URLSearchParams(location.search).get('id');
    if(idUrl && S.candidats.some(c=>c.id===idUrl)){ S.id=idUrl; S.vue='fiche'; history.replaceState(null,'',location.pathname); } S.sheetUrl=j.sheetUrl; S.driveUrl=j.driveUrl; S.registreUrl=j.registreUrl||'';
    rendu();
  }catch(e){
    if(/Clé/.test(e.message)){ localStorage.removeItem('rec_cle'); S.cle=''; return ecranLogin('Clé incorrecte.'); }
    $('app').innerHTML=`<div class="alerte rouge">Impossible de charger : ${esc(e.message)}</div><button class="btn" onclick="charger()">Réessayer</button>`;
  }
}
function ecranLogin(msg){
  $('app').innerHTML=`<div class="login carte"><h2 style="color:var(--or);margin-top:0">Connexion</h2>
  <p>Tape la clé admin reçue par mail lors de l'installation du script Google.</p>
  ${msg?`<div class="alerte rouge">${esc(msg)}</div>`:''}
  <input id="cleIn" placeholder="Clé admin" autocapitalize="characters" style="text-transform:uppercase">
  <div class="barre-act"><button class="btn plein" onclick="S.cle=$('cleIn').value.trim().toUpperCase();localStorage.setItem('rec_cle',S.cle);charger()">Entrer</button></div></div>`;
}
let minuteur=null;
function sauver(){
  clearTimeout(minuteur);
  minuteur=setTimeout(async()=>{
    const r=cur(); if(!r) return;
    try{ await api('enregistrer',{rec:r}); toast('Enregistré ✓'); }catch(e){ toast('⚠️ '+e.message); }
  },700);
}

// =====================================================================
//  RÈGLES / ALERTES
// =====================================================================
function cfg(){return S.config||{};}
function piecesRequises(r){
  const c=r.candidat||{}, s={mineur:!!c.mineur,horsUE:c.nationaliteType==='hors_ue',dispense:c.mutuelleDispense==='oui',passeport:c.pieceType==='passeport'};
  const liste=(cfg().pieces||[]).filter(p=>p.key!=='photo').concat([{key:'photo',label:'Photo de l\'équipier',req:'oui'}]);
  return liste.filter(p=>{
    if(p.req==='non') return false;
    if(p.req==='hors_ue') return s.horsUE; if(p.req==='mineur') return s.mineur; if(p.req==='dispense') return s.dispense;
    if(p.key==='id_verso'&&s.passeport) return false;
    return true;
  });
}
function piecesManquantes(r){const ks=(r.docs||[]).map(d=>d.key);return piecesRequises(r).filter(p=>!ks.includes(p.key));}
function heuresDepuis(iso){return (Date.now()-new Date(iso).getTime())/3600000;}
function joursAvant(iso){return Math.ceil((new Date(iso+'T00:00:00')-new Date(auj()+'T00:00:00'))/86400000);}
function joursOuvrablesApres(iso,n){let d=new Date(iso+'T00:00:00'),k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()!==0)k++;}return d.toISOString().slice(0,10);}
function alertes(r){
  const A=[], s=r.suivi||{}, ct=s.contrat||{}, c=r.candidat||{}, se=cfg().seuils||{};
  const v={...(s.validation||{})};
  if(v.type==='extra'){const ms=(v.missions||[]).filter(m=>m.date).map(m=>m.date).sort();if(ms.length){v.debut=ms[0];v.fin=ms.at(-1);}}
  if(r.statut!=='en_cours') return A;
  const i=IDX[r.etape];
  if(r.etape==='recu' && heuresDepuis(r.cree)>(se.contactHeures||48)) A.push(['rouge',`À contacter (plus de ${se.contactHeures||48} h)`]);
  const e=s.entretien||{};
  if(e.date && e.date.slice(0,10)===auj()) A.push(['bleu','Entretien aujourd\'hui '+e.date.slice(11,16)]);
  if(i<=IDX.validation && e.date && v.decision!=='retenu' && heuresDepuis(e.date)>24*(se.decisionJours||3)) A.push(['orange',`Décision en attente (+${se.decisionJours||3} j)`]);
  const m=piecesManquantes(r); if(m.length) A.push(['orange',m.length+' pièce(s) manquante(s)']);
  if(v.decision==='retenu' && v.debut && i<IDX.demarrage){
    const j=joursAvant(v.debut);
    if(!ct.dpae && j<=(se.dpaeJours??1)) A.push(['rouge',j<0?'DPAE non faite — déjà démarré !':'DPAE à faire avant le '+fr(v.debut)]);
    if(!ct.signe && v.type!=='extra' && j<=2) A.push(['rouge','Contrat non signé — démarrage le '+fr(v.debut)]);
    if(!ct.signe && v.type==='extra'){ const lim=joursOuvrablesApres(v.debut,se.contratExtraJours||2); if(auj()>=v.debut) A.push([auj()>lim?'rouge':'orange','Contrat d\'extra à faire signer avant le '+fr(lim)]); }
  }
  if(c.nationaliteType==='hors_ue' && c.sejourFin){
    const fin=v.fin||v.debut||auj();
    if(c.sejourFin<fin || joursAvant(c.sejourFin)<30) A.push(['rouge','Titre de séjour : fin le '+fr(c.sejourFin)]);
  }
  if(c.mineur) A.push(['orange','Mineur']);
  return A;
}

// =====================================================================
//  VUES
// =====================================================================
function vue(v){S.vue=v;rendu();window.scrollTo(0,0);}
function rendu(){
  if(S.vue==='fiche'&&cur()) return renduFiche();
  if(S.vue==='reglages') return renduReglages();
  S.vue='liste'; renduListe();
}
function bandeauDemo(){return S.demo?`<div class="alerte info">Mode démonstration : l'appli n'est pas encore reliée au script Google (adresse à mettre dans config.js). Les données affichées sont fictives et rien n'est enregistré.</div>`:'';}

// ---------- LISTE ----------
function renduListe(){
  const L=S.candidats;
  const compte=k=>L.filter(r=>r.statut==='en_cours'&&r.etape===k).length;
  const nbAl=L.filter(r=>alertes(r).some(a=>a[0]==='rouge')).length;
  const filtres=[['actifs','En cours',L.filter(r=>r.statut==='en_cours'&&r.etape!=='enposte').length],['alertes','⚠️ Urgent',nbAl],...ETAPES.map(e=>[e.k,e.c,compte(e.k)]),['vivier','Vivier',L.filter(r=>r.statut==='vivier').length],['refuse','Refusés / désistés',L.filter(r=>r.statut==='refuse'||r.statut==='desiste').length]];
  let liste=L.filter(r=>{
    if(S.filtre==='actifs') return r.statut==='en_cours'&&r.etape!=='enposte';
    if(S.filtre==='alertes') return alertes(r).some(a=>a[0]==='rouge');
    if(S.filtre==='vivier') return r.statut==='vivier';
    if(S.filtre==='refuse') return r.statut==='refuse'||r.statut==='desiste';
    return r.statut==='en_cours'&&r.etape===S.filtre;
  });
  const q=S.recherche.toLowerCase();
  if(q) liste=L.filter(r=>((r.candidat.nom||'')+' '+(r.candidat.prenom||'')+' '+(r.candidat.tel||'')).toLowerCase().includes(q));
  liste.sort((a,b)=>alertes(b).filter(x=>x[0]==='rouge').length-alertes(a).filter(x=>x[0]==='rouge').length || (b.cree||'').localeCompare(a.cree||''));
  $('app').innerHTML=bandeauDemo()+`
  <div class="compteurs">${filtres.map(([k,n,v])=>`<button class="${S.filtre===k&&!q?'on':''}" onclick="S.filtre='${k}';S.recherche='';renduListe()"><b>${v}</b><span>${n}</span></button>`).join('')}</div>
  <input placeholder="🔎 Rechercher un nom, un téléphone…" value="${esc(S.recherche)}" oninput="S.recherche=this.value;clearTimeout(window._rt);window._rt=setTimeout(()=>{renduListe();const i=document.querySelector('main input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)" style="margin-bottom:10px">
  ${liste.length?liste.map(carteCandidat).join(''):'<div class="vide">Aucun candidat ici.</div>'}`;
}
function carteCandidat(r){
  const c=r.candidat, v=(r.suivi||{}).validation||{};
  const sous=[(c.postes||[]).join(', '), v.decision==='retenu'&&v.type?TYPES_CONTRAT[v.type].court:c.contratSouhaite, c.dispoDebut?'dispo '+fr(c.dispoDebut):''].filter(Boolean).join(' · ');
  const st=r.statut==='en_cours'?ETAPES[IDX[r.etape]].c:({vivier:'Vivier',refuse:'Refusé',desiste:'Désisté'}[r.statut]);
  return `<div class="carte cand" onclick="ouvrir('${r.id}')">
    <div class="av">${esc((c.prenom||'?')[0]+(c.nom||'?')[0])}</div>
    <div class="info"><div class="nom">${esc(c.prenom)} ${esc(c.nom)}${c.age?` <span class="badge">${c.age} ans</span>`:''}</div>
      <div class="sous">${esc(sous)}</div>
      <div>${alertes(r).map(a=>`<span class="badge ${a[0]}">${esc(a[1])}</span>`).join('')}</div></div>
    <div class="etp">${esc(st)}<br><span style="color:var(--gris)">${fr(r.cree)}</span></div></div>`;
}
function ouvrir(id){S.id=id;vue('fiche');}

// ---------- FICHE ----------
function get(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);}
function set(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k];});a[ks.at(-1)]=v;}
function champ(lbl,p,type='text',opts){return '<div>'+champBrut(lbl,p,type,opts)+'</div>';}
function champBrut(lbl,p,type='text',opts){
  const v=get(cur(),p)??'';
  if(type==='select') return `<label class="l">${lbl}</label><select data-p="${p}"${opts.rerender?' data-r="1"':''}>${opts.choix.map(([k,n])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  if(type==='textarea') return `<label class="l">${lbl}</label><textarea data-p="${p}" rows="3">${esc(v)}</textarea>`;
  return `<label class="l">${lbl}</label><input type="${type}" data-p="${p}" value="${esc(v)}"${opts&&opts.rerender?' data-r="1"':''}${opts&&opts.step?` step="${opts.step}"`:''}>`;
}

function caseScan(lbl,p,key,label,sous){

    <span style="font-size:12px;color:var(--gris)"> plusieurs pages : sélectionne toutes les photos, elles sont réunies en un PDF</span></div>`;

async function scannerSigne(inp,key,label,p){
  const fs=[...inp.files]; if(!fs.length) return;
  const r=cur(); toast('Préparation du PDF…');
  try{
    let data,mime,name;
    if(fs.length===1 && fs[0].type==='application/pdf'){ mime='application/pdf'; name=fs[0].name; data=await new Promise((ok,ko)=>{const rd=new FileReader();rd.onload=()=>ok(String(rd.result).split(',')[1]);rd.onerror=ko;rd.readAsDataURL(fs[0]);}); }
    else{
      const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4'});
      for(let i=0;i<fs.length;i++){
        if(!fs[i].type.startsWith('image/')) continue;
        const im=await compresser(fs[i]); const src='data:image/jpeg;base64,'+im.data;
        const dim=await new Promise(ok=>{const x=new Image();x.onload=()=>ok([x.naturalWidth,x.naturalHeight]);x.src=src;});
        const k=Math.min(200/dim[0],287/dim[1]), w=dim[0]*k, h=dim[1]*k;
        if(i) pdf.addPage(); pdf.addImage(src,'JPEG',(210-w)/2,(297-h)/2,w,h);
      }
      data=pdf.output('datauristring').split(',')[1]; mime='application/pdf'; name=label+'.pdf';
    }
    if(S.demo){ r.docs.push({key,label,url:'#',date:new Date().toISOString()}); }
    else{ const j=await api('televerser',{id:r.id,fichiers:[{key,label,name,mime,data}]}); Object.assign(r,{docs:j.rec.docs,journal:j.rec.journal}); }
    if(!get(r,p)) set(r,p,auj());
    sauver(); const y=scrollY; renduFiche(); scrollTo(0,y); toast('Document signé rangé dans le dossier ✓');
  }catch(e){ alert('Échec : '+e.message); }
}

// ---- Disponibilités : format compact du formulaire « lun:j|mar:11:00-15:00|mer:n » ou « tout »
const JOURS_D=[['lun','Lundi'],['mar','Mardi'],['mer','Mercredi'],['jeu','Jeudi'],['ven','Vendredi'],['sam','Samedi'],['dim','Dimanche']];
function lireDispos(c){
  const o={}; JOURS_D.forEach(([k])=>o[k]={m:'j',de:'11:00',a:'15:00'});
  if(!c.dispoJours||c.dispoJours==='tout'||c.toutDispo==='oui') return {tout:c.dispoJours==='tout'||c.toutDispo==='oui',jours:o,vide:!c.dispoJours&&c.toutDispo!=='oui'};
  c.dispoJours.split('|').forEach(x=>{const k=x.slice(0,3),v=x.slice(4);if(!o[k])return;if(v==='j'||v==='n')o[k].m=v;else{const[de,a]=v.split('-');o[k]={m:'p',de,a};}});
  return {tout:false,jours:o,vide:false};
}
function ecrireDispos(c,D){c.toutDispo=D.tout?'oui':'non';c.dispoJours=D.tout?'tout':JOURS_D.map(([k])=>{const d=D.jours[k];return k+':'+(d.m==='p'?d.de+'-'+d.a:d.m);}).join('|');}
function resumeDispos(c){
  const D=lireDispos(c); if(D.vide) return 'non renseignées'; if(D.tout) return 'totalement disponible';
  return JOURS_D.map(([k,l])=>{const d=D.jours[k];return l.slice(0,3)+' '+(d.m==='j'?'journée':d.m==='n'?'—':d.de+'-'+d.a);}).join(' · ');
}
function m2(v,fin){const[h,mm]=String(v||'0:0').split(':').map(Number);let m=h*60+mm;if(fin&&m===0)m=1440;return m;}
function dispoHPlanning(c){ // format de l'appli Planning : {lun:[{s,e}] en minutes}
  const D=lireDispos(c); if(D.vide) return null;
  const o={}; JOURS_D.forEach(([k])=>{const d=D.jours[k];o[k]=D.tout||d.m==='j'?[{s:360,e:1440}]:d.m==='n'?[]:[{s:m2(d.de),e:m2(d.a,true)}].filter(x=>x.e>x.s);});
  return o;
}
function editeurDispos(r){
  const c=r.candidat, D=lireDispos(c);
  return `<b style="display:block;margin-top:10px;color:var(--or)">Disponibilités dans la semaine</b>

  ${D.tout?'':JOURS_D.map(([k,l])=>{const d=D.jours[k];return `<div class="g3" style="align-items:end"><div><label class="l">${l}</label><select onchange="majDispo('${k}.m',this.value)">${[['j','Toute la journée'],['p','De… à…'],['n','Pas dispo']].map(([a,b])=>`<option value="${a}" ${d.m===a?'selected':''}>${b}</option>`).join('')}</select></div>${d.m==='p'?`<div><input type="time" value="${d.de}" onchange="majDispo('${k}.de',this.value)"></div><div><input type="time" value="${d.a}" onchange="majDispo('${k}.a',this.value)"></div>`:'<div></div><div></div>'}</div>`;}).join('')}`;
}
function majDispo(ch,val){

const POSTES_PLANNING={moule:'Moule',frite:'Frite',bar:'Bar',salle:'Salle',plonge:'Plonge',sauce:'Sauce',dessert:'Dessert'};
function postesPlanning(c){
  const out=new Set();
  (c.postes||[]).forEach(p=>{const l=p.toLowerCase();Object.keys(POSTES_PLANNING).forEach(k=>{if(l.startsWith(k))out.add(POSTES_PLANNING[k]);});});

}
function dateFinEssai(v){
  if(!v.debut||!v.essai||/aucune/i.test(v.essai)) return null;
  const n=parseInt(v.essai,10); if(!n) return null;
  const d=new Date(v.debut+'T12:00:00');
  if(/mois/i.test(v.essai)){d.setMonth(d.getMonth()+n);d.setDate(d.getDate()-1);} else d.setDate(d.getDate()+n-1);
  return d;
}
function heuresEquipier(r){
  const v=r.suivi.validation||{};
  let h=Number(v.heures)||35;
  if(v.type==='extra'){ // extra : total des vacations prévues
    const min=(v.missions||[]).reduce((a,m)=>{if(!m.debut||!m.fin)return a;const[x,y]=m.debut.split(':').map(Number),[z,w]=m.fin.split(':').map(Number);let d=(z*60+w)-(x*60+y);if(d<0)d+=1440;return a+d;},0);
    h=Math.min(34.5,Math.max(1,Math.round(min/30)/2));
  }
  return h;
}
function donneesPointeuse(r){
  const c=r.candidat, v=r.suivi.validation||{}, d=r.suivi.demarrage||{};
  const h=heuresEquipier(r);
  return { name:`${c.prenom||''} ${(c.nom||'').toUpperCase()}`.trim(), contractType:({cdd_saison:'CDD',extra:'Extra',cdi_annualise:'CDI'})[v.type]||'CDD', contractHours:h, plannedTime:d.heure||v.heureDebut||'' };
}
function donneesPlanning(r){
  const c=r.candidat, v=r.suivi.validation||{}, TS=firebase.firestore.Timestamp;
  const pub={postes:postesPlanning(c), contractTemplate:'equipier', dispoNotes:c.dispoDetail||''};
  const dh=dispoHPlanning(c); if(dh) pub.dispoH=dh;
  if(v.debut) pub.contractStart=TS.fromDate(new Date(v.debut+'T12:00:00'));
  if(v.fin && v.type!=='cdi_annualise') pub.contractEnd=TS.fromDate(new Date(v.fin+'T12:00:00'));
  const fe=dateFinEssai(v); if(fe) pub.trialEndDate=TS.fromDate(fe);
  const priv={phone:c.tel||'',email:c.email||'',address:[c.adresse,[c.cp,c.ville].filter(Boolean).join(' ')].filter(Boolean).join(', '),nir:c.secuAttente==='oui'?'':(c.secu||'')};
  if(v.type!=='extra'&&v.taux) priv.grossSalary=calculPaie(heuresEquipier(r),v.taux).mensuel;
  return {pub,priv};
}

function copierPlanning(){
  const r=cur(), c=r.candidat, v=r.suivi.validation||{};
  const t=`${c.prenom} ${c.nom}\nTél : ${c.tel}\nMail : ${c.email||''}\nPoste(s) : ${(c.postes||[]).join(', ')}\nContrat : ${TYPES_CONTRAT[v.type]?.court||''} — ${v.heures||''} h/sem\nDu ${fr(v.debut)}${v.fin?' au '+fr(v.fin):''}\nDisponibilités : ${resumeDispos(c)}${c.dispoDetail?' — '+c.dispoDetail:''}${c.mineur?'\n⚠️ Mineur : 8 h/jour et 35 h/semaine max, pas au bar':''}`;
  navigator.clipboard.writeText(t).then(()=>toast('Fiche copiée ✓ — colle-la dans Planning & RH'));
}
async function supprimer(){
  const r=cur(), nom=`${r.candidat.prenom} ${r.candidat.nom}`, ptId=(r.suivi.demarrage||{}).pointeuseId;
  if(!confirm(`Supprimer définitivement la fiche de ${nom} ?\nSon dossier Drive sera mis à la corbeille.`)) return;
  // Pointeuse + Planning : l'équipier est retiré (comme « Retirer » dans ces applis), ses pointages restent dans l'historique
  if(ptId && ptId!=='demo' && confirm(`${nom} est aussi dans la Pointeuse et Planning & RH.\nL'en retirer également ? (ses pointages éventuels restent dans l'historique)`)){
    try{
      if(!(await connecterPointeuse())) return;
      await pointeuseApp().firestore().collection('employees').doc(ptId).update({active:false});
      toast('Retiré de la Pointeuse et de Planning ✓');
    }catch(e){ if(!confirm('Impossible de le retirer de la Pointeuse ('+(e.message||e)+').\nSupprimer quand même la fiche ?')) return; }
  }
  if(r.registre&&r.registre.no) alert(`${nom} est inscrit au registre du personnel (n° ${r.registre.no}).\nLa ligne n'est pas effacée automatiquement : un vrai registre ne s'efface jamais.\nSi c'était un essai, supprime-la à la main dans l'onglet « Registre du personnel » de la Google Sheet (ou supprime l'onglet entier avant ta première vraie embauche : il sera recréé vierge).`);
  try{await api('supprimer',{id:r.id});S.candidats=S.candidats.filter(x=>x.id!==r.id);vue('liste');toast('Fiche supprimée');}catch(e){alert(e.message);}
}
async function creerFiche(){
  const p=prompt('Prénom et NOM du candidat (ex. : Léa MARTIN)'); if(!p) return;
  const m=p.trim().split(/\s+/); const prenom=m.shift(), nom=(m.join(' ')||'').toUpperCase();
  const tel=prompt('Téléphone ?')||'';
  try{const j=await api('creer',{candidat:{prenom,nom,tel,postes:[]}});S.candidats.unshift(j.rec);ouvrir(j.rec.id);}catch(e){alert(e.message);}
}

function majCfg(g,k,v,t){S.config[g]=S.config[g]||{};S.config[g][k]=t==='number'?Number(v):v;sauverCfg();}
let mCfg=null;
function sauverCfg(){clearTimeout(mCfg);mCfg=setTimeout(async()=>{try{await api('config',{config:S.config});toast('Réglages enregistrés ✓');if(S.vue==='reglages')renduReglages();}catch(e){toast('⚠️ '+e.message);}},600);}

function demoApi(action,d){
  if(action==='pdf'){ const r=cur(); r.contrats.push({type:d.type,nom:d.nom+'.pdf',url:'#',date:new Date().toISOString().slice(0,19)}); return {ok:true,url:'about:blank',rec:r}; }
  if(action==='creer'){ return {ok:true,rec:{id:'D'+Date.now(),cree:new Date().toISOString().slice(0,19),etape:'recu',statut:'en_cours',candidat:d.candidat,docs:[],suivi:{},journal:[],contrats:[]}}; }
  if(action==='televerser'){ const r=cur(); r.docs.push({key:d.fichiers[0].key,label:d.fichiers[0].label,url:'#',date:new Date().toISOString()}); return {ok:true,rec:r}; }
  return {ok:true};
}
